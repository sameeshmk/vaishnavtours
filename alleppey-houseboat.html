    .seo-hero {
      position: relative;
      min-height: 470px;
      margin-top: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
    }

    .seo-hero img {
      width: 100%;
      min-height: 470px;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.58) saturate(1.08);
    }

    .seo-hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(7, 11, 16, 0.05),
          rgba(7, 11, 16, 0.9)
        );
    }

    .seo-hero-content {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 28px;
      z-index: 2;
    }

    .seo-hero-content h1 {
      max-width: 390px;
      margin: 10px 0 12px;
      font-size:
        clamp(2.1rem, 7vw, 3.2rem);
      line-height: 1.05;
    }

    .seo-hero-content p {
      max-width: 390px;
      color: rgba(255,255,255,0.92);
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .content-card {
      padding: 20px 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background:
        rgba(17, 24, 31, 0.78);
    }

    .content-card h2 {
      margin-bottom: 12px;
      font-size:
        clamp(1.5rem, 5vw, 2.1rem);
    }

    .content-card p {
      color: var(--muted);
      line-height: 1.75;
    }

    .content-card p + p {
      margin-top: 12px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .feature-item {
      padding: 17px 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        rgba(17, 24, 31, 0.78);
    }

    .feature-item strong {
      display: block;
      color: var(--gold-soft);
      margin-bottom: 7px;
    }

    .feature-item p {
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.85rem;
    }

    .seo-package-grid {
      display: grid;
      gap: 16px;
    }

    .seo-package {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background:
        linear-gradient(
          180deg,
          rgba(17, 24, 31, 0.98),
          rgba(10, 15, 19, 0.96)
        );
    }

    .seo-package img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }

    .seo-package-body {
      padding: 18px 16px;
    }

    .seo-package-body h3 {
      margin: 10px 0;
      font-size: 1.45rem;
    }

    .seo-package-body p {
      color: var(--muted);
      line-height: 1.65;
    }

    .seo-package-body ul {
      display: grid;
      gap: 7px;
      margin: 16px 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .seo-package-body li::before {
      content: "✓";
      margin-right: 8px;
      color: var(--gold-soft);
      font-weight: 700;
    }

    .itinerary {
      display: grid;
      gap: 12px;
    }

    .itinerary-step {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 12px;
      align-items: start;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        rgba(17, 24, 31, 0.73);
    }

    .step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background:
        rgba(216, 176, 107, 0.14);
      color: var(--gold-soft);
      font-weight: 800;
    }

    .itinerary-step h3 {
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .itinerary-step p {
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.86rem;
    }

    .booking-guide {
      display: grid;
      gap: 12px;
    }

    .guide-row {
      padding: 16px;
      border-left:
        3px solid var(--gold);
      border-radius: 0 14px 14px 0;
      background:
        rgba(216, 176, 107, 0.06);
    }

    .guide-row strong {
      display: block;
      color: var(--gold-soft);
      margin-bottom: 5px;
    }

    .guide-row p {
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.87rem;
    }

    .faq-list {
      display: grid;
      gap: 12px;
    }

    .faq-card {
      padding: 17px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        rgba(17, 24, 31, 0.76);
    }

    .faq-card h3 {
      color: var(--gold-soft);
      margin-bottom: 8px;
      font-size: 1rem;
      line-height: 1.4;
    }

    .faq-card p {
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.88rem;
    }

    .seo-cta {
      display: grid;
      gap: 12px;
      margin-top: 28px;
      padding: 24px 18px;
      text-align: center;
      border-radius: 24px;
      border:
        1px solid rgba(
          216,
          176,
          107,
          0.4
        );
      background:
        rgba(216, 176, 107, 0.08);
    }

    .seo-cta h2 {
      font-size:
        clamp(1.45rem, 5vw, 2rem);
    }

    .seo-cta p {
      color: var(--muted);
      line-height: 1.6;
    }

    .seo-cta-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 16px 2px 4px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .breadcrumb a {
      color: var(--gold-soft);
      text-decoration: none;
    }

    @media (max-width: 420px) {

        grid-template-columns: 1fr;
      }

      .seo-hero,
